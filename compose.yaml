services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outpatient-care-app
    working_dir: /var/www/html
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: outpatient_care
      DB_USERNAME: outpatient
      DB_PASSWORD: outpatient_dev_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: outpatient-care-db
    environment:
      MARIADB_DATABASE: outpatient_care
      MARIADB_USER: outpatient
      MARIADB_PASSWORD: outpatient_dev_password
      MARIADB_ROOT_PASSWORD: local_root_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: outpatient-care-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
