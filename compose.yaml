name: poli-dokter-revisi
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: rsi_rawat_jalan_revisi
      MARIADB_USER: rsi_revisi
      MARIADB_PASSWORD: revisi_local_dev
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:3318:3306"
    volumes:
      - data_revisi:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 25
    restart: unless-stopped

volumes:
  data_revisi:
