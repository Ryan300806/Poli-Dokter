services:
  db:
    image: mariadb:11.4
    container_name: poli-db
    environment:
      MARIADB_DATABASE: rsi_outpatient_care
      MARIADB_USER: rsi_user
      MARIADB_PASSWORD: rsi_dev_password
      MARIADB_ROOT_PASSWORD: rsi_root_password_change_me
    ports:
      - "3309:3306"
    volumes:
      - poli_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: poli-phpmyadmin
    ports:
      - "8092:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poli_mariadb_data: